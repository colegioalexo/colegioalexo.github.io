name: Deploy Angular na Master

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo da master
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar pacotes e gerar build do Angular
        run: |
          npm install
          npx ng build --base-href /
          cp dist/colegioalexo/browser/index.html dist/colegioalexo/browser/404.html

      - name: Preparar arquivos estaticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/colegioalexo/browser

      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4
